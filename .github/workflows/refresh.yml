name: refresh-snapshot

# 云端备份链路：全时段每 10 分钟抓取行情并重建快照。
# 若数据无实质变化（休市、周末、夜间）则跳过提交，避免空转。
# 推回本仓库后 GitHub Pages 自动更新。本地 Mac 服务仍是主链路。
on:
  workflow_dispatch:
  schedule:
    # 全时段每 10 分钟（错开整点高峰）
    - cron: "4,14,24,34,44,54 * * * *"

permissions:
  contents: write

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Backup previous snapshot
        run: cp state.json /tmp/old_state.json

      - name: Fetch data and rebuild snapshot
        run: python3 monitor/run_refresh.py

      - name: Restore files if nothing meaningful changed
        run: |
          if python3 - <<'EOF'
          import json, sys
          IGNORE_TOP = ("generated_at", "generated_at_seoul", "trigger")
          def normalize(path):
              d = json.load(open(path))
              for k in IGNORE_TOP:
                  d.pop(k, None)
              dq = d.get("data_quality") or {}
              dq.pop("next_scheduled_refresh", None)
              for src in (dq.get("sources") or {}).values():
                  src.pop("fetched_at", None)
              return d
          sys.exit(0 if normalize("state.json") != normalize("/tmp/old_state.json") else 1)
          EOF
          then
            echo "meaningful change detected, will publish"
          else
            echo "no meaningful change; restoring files to skip commit"
            git restore state.json monitor/data
          fi

      - name: Commit and push snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no-change"
            exit 0
          fi
          git commit -m "cloud snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            if git pull --no-rebase -X ours --no-edit origin main && git push origin main; then
              echo "pushed"
              exit 0
            fi
            sleep 5
          done
          echo "push failed after retries" >&2
          exit 1
