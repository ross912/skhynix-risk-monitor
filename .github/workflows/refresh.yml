name: refresh-snapshot

# 云端备份链路：在 GitHub Actions 免费额度内定时抓取行情并重建快照，
# 推回本仓库后 GitHub Pages 自动更新。本地 Mac 服务仍是主链路。
on:
  workflow_dispatch:
  schedule:
    # 韩股时段：UTC 00:00-07:59 ≈ 首尔 09:00-16:59（含每日收盘刷新 16:40）
    - cron: "7,22,37,52 0-7 * * 1-5"
    # 美股 ADR 时段：UTC 14:00-20:59 ≈ 美东夏令 10:00-16:59
    - cron: "11,26,41,56 14-20 * * 1-5"

permissions:
  contents: write

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch data and rebuild snapshot
        run: python3 monitor/run_refresh.py

      - name: Commit and push snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no-change"
            exit 0
          fi
          git commit -m "cloud snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            if git pull --no-rebase -X ours --no-edit origin main && git push origin main; then
              echo "pushed"
              exit 0
            fi
            sleep 5
          done
          echo "push failed after retries" >&2
          exit 1
